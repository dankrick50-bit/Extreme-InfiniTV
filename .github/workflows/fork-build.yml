# Builds installable apps for every platform from a fork, without the author's signing secrets.
# Results are published to the fork's rolling "fork-latest" release, together with latest.json,
# the file installed apps read to find out that a newer build exists.
#
# The fork's own keys, stored as repository secrets, make updates installable over an existing app:
#   ANDROID_KEYSTORE_*           one signing key for every APK (Android refuses any other)
#   TAURI_SIGNING_PRIVATE_KEY*   signs the Windows and AppImage installers for self-update
# Without them the build still works; it just cannot be installed as an update.
#
# A branch named try/... is a test build: it makes the all-device Android APK only and publishes
# nothing, so installed apps never update to it. The APK is kept with the run as an artifact.
name: Fork build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ !startsWith(github.ref_name, 'try/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: ubuntu
            args: "--bundles deb,appimage"
            rust-targets: ""
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: fork-${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # Fork branding, and updates pointed at the fork's own release instead of the author's.
      - name: Write build override
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node build-tools/make-build-config.mjs --out fork-override.json

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }} --config fork-override.json

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          NAME="$(node -p "require('./build-tools/brand.json').productName")"
          for f in src-tauri/target/release/bundle/deb/*.deb; do cp "$f" "out/$NAME-ubuntu-amd64.deb"; done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do cp "$f" "out/$NAME-linux-x86_64.AppImage"; done
          for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do cp "$f" "out/$NAME-macos-universal.dmg"; done
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do cp "$f" "out/$NAME-windows-x64-setup.exe"; done
          # Update signatures, present only when the signing key is. They cover the file's contents, so renaming is fine.
          for f in src-tauri/target/release/bundle/deb/*.deb.sig; do cp "$f" "out/$NAME-ubuntu-amd64.deb.sig"; done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do cp "$f" "out/$NAME-linux-x86_64.AppImage.sig"; done
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe.sig; do cp "$f" "out/$NAME-windows-x64-setup.exe.sig"; done
          ls -la out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::The build finished but produced no installer"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          # "kdpatch": build folders cached before the freeze fix below hold an unfixed Tauri.
          key: fork-android-kdpatch1

      - run: pnpm install --frozen-lockfile

      - name: Use the fork's permanent signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          {
            echo "XTREAM_KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks"
            echo "XTREAM_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "XTREAM_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "XTREAM_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # An APK must be signed to install. Without a stored key, each run signs with a new one,
      # so a newer build cannot be installed over an older one without uninstalling first.
      - name: Generate a one-off signing key
        if: env.HAS_KEYSTORE != 'true'
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$RUNNER_TEMP/keystore.jks" -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias fork \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Extreme InfiniTV fork build"
          {
            echo "XTREAM_KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks"
            echo "XTREAM_KEYSTORE_PASSWORD=$PASS"
            echo "XTREAM_KEY_ALIAS=fork"
            echo "XTREAM_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          echo "::warning::APK signed with a one-off key. Add ANDROID_KEYSTORE_* secrets to this fork to keep one key across builds."

      # Must come before anything is compiled; see build-tools/patch-tauri-android.mjs.
      - name: Apply the Android freeze fix to the app framework
        run: |
          set -euo pipefail
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          node build-tools/patch-tauri-android.mjs

      - name: Build APK (universal)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --apk

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
          if [ -z "$APK" ]; then
            echo "::error::Could not locate the APK after the build"
            find src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi
          NAME="$(node -p "require('./build-tools/brand.json').productName")"
          cp "$APK" "out/$NAME-android-fireos.apk"
          # Prints which key signed it: an update only installs when this matches the installed app's.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "out/$NAME-android-fireos.apk"
          ls -la out

      # The same app carrying one processor family's code only, so it is smaller to download, store
      # and install: 64-bit ARM is what the Fire HD 10 (2023) runs, 32-bit ARM what the Fire TV
      # Stick 4K runs. Same package and signing key as the build above, so any of the three
      # installs over any other. The Rust code is already compiled; this only repackages.
      - name: Build device APKs
        if: ${{ !startsWith(github.ref_name, 'try/') }}
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Collect device APKs
        if: ${{ !startsWith(github.ref_name, 'try/') }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./build-tools/brand.json').productName")"
          APKS=src-tauri/gen/android/app/build/outputs/apk
          find "$APKS" -name "*.apk" -printf '%s %p\n'
          ARM64=$(find "$APKS" -name "*arm64*release*.apk" ! -name "*unsigned*" | head -1)
          ARMV7=$(find "$APKS" -name "*-arm-*release*.apk" ! -name "*unsigned*" | head -1)
          if [ -n "$ARM64" ]; then cp "$ARM64" "out/$NAME-fire-hd10-2023.apk"; else echo "::warning::No 64-bit ARM APK was produced"; fi
          if [ -n "$ARMV7" ]; then cp "$ARMV7" "out/$NAME-fire-tv-stick-4k.apk"; else echo "::warning::No 32-bit ARM APK was produced"; fi
          for f in out/*-fire-*.apk; do
            [ -e "$f" ] || continue
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$f" | head -2
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: out/*
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    if: ${{ !cancelled() && !startsWith(github.ref_name, 'try/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Publish to the fork-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No platform produced an installer"
            exit 1
          fi
          # Folds the signatures into latest.json, which is what installed apps check for a newer build.
          node build-tools/make-update-feed.mjs --dir out --repo "$GITHUB_REPOSITORY" --tag fork-latest
          ls -la out
          VERSION="$(node -p "require('./package.json').version")"
          gh release delete fork-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create fork-latest out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Fork build $VERSION (${GITHUB_SHA::7})" \
            --notes "Builds of this fork at commit $GITHUB_SHA. Windows: setup.exe. Ubuntu: .deb (or the portable .AppImage). macOS: .dmg. Android and Fire OS: android-fireos.apk fits every device; fire-hd10-2023.apk (64-bit ARM) and fire-tv-stick-4k.apk (32-bit ARM) are the same app made smaller for those devices. Installed apps find this build through latest.json."
